name: Editor's Letter

on:
  schedule:
    - cron: '0 1 * * 1' # weekly on Mondays at 1 AM UTC (Sunday 8 PM Eastern)
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-letter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main-Branch
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run editor letter protocol
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print \
            "Run the editor letter protocol (Steps 1 through 4 in EDITOR-LETTER-PROTOCOL.md). \
            IMPORTANT: Do NOT commit or push any changes — the CI workflow handles git operations after you finish. \
            Skip the git commands in Step 4; just write the files." \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch"

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="autofiction/editors-letter-$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"

          git add stories/ memory/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          # Use the newest editor's letter filename as the commit subject
          letter=$(git diff --cached --name-only -- stories/ | grep editors-letter | head -1 | xargs -r basename | sed 's/\.md$//')
          if [ -z "$letter" ]; then
            letter="editors-letter"
          fi

          git commit -m "Add editor's letter: ${letter}"
          git push origin "$branch"

          gh pr create \
            --title "Editor's Letter: ${letter}" \
            --body "Automatically generated by the Editor's Letter protocol (weekly)." \
            --base Main-Branch
