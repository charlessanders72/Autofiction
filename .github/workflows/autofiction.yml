name: Autofiction Protocol

on:
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main-Branch
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run autofiction protocol
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print \
            "Run the autofiction protocol (Steps 1 through 5 in PROTOCOL.md). \
            IMPORTANT: Do NOT commit or push any changes — the CI workflow handles git operations after you finish. \
            Skip the git commands in Step 4; just write the files." \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch"

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="autofiction/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"

          git add stories/ memory/ PROTOCOL.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          # Use the newest story filename as the commit subject
          story=$(git diff --cached --name-only -- stories/ | head -1 | xargs -r basename | sed 's/\.md$//')
          if [ -z "$story" ]; then
            story="daily-update"
          fi

          git commit -m "Add story: ${story}"
          git push origin "$branch"

          gh pr create \
            --title "Story: ${story}" \
            --body "Automatically generated by the Autofiction protocol (daily)." \
            --base Main-Branch
