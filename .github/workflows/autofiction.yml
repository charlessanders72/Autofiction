name: Autofiction Protocol

on:
  schedule:
    - cron: '0 13 * * *' # daily at 8 AM Eastern (1 PM UTC)
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main-Branch
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run autofiction protocol
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print "run autofiction protocol" \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(git *)"

      - name: Push and open PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="autofiction/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$branch"

          git add stories/ memory/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          # Use the newest story filename as the commit subject
          story=$(git diff --cached --name-only -- stories/ | head -1 | xargs basename | sed 's/\.md$//')
          git commit -m "Add story: ${story}"
          git push origin "$branch"

          gh pr create \
            --title "Story: ${story}" \
            --body "Automatically generated by the Autofiction protocol (daily)." \
            --base Main-Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
